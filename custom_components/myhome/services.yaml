sync_time:
  name: Syncronize time
  description: Syncronize gateway's time to HA local time.
  fields:
    gateway:
      name: Gateway
      description: The gateway's MAC address, as present in the config.
      example: 00:03:50:00:00:00

send_message:
  name: Send message
  description: Send an arbitrary (but valid) OpenWebNet message to the gateway.
  fields:
    gateway:
      name: Gateway
      description: The gateway's MAC address, as present in the config.
      example: 00:03:50:00:00:00
    message:
      name: Message
      description: Valid OpenWebNet message.
      example: "*1*0*0##"

start_sending_instant_power:
  name: Start sending instant power
  description: Get automatic instant power draw updates for a sensor.
  fields:
    entity_id:
      name: Entity
      description: Name(s) of entities that will start sending instant power information.
      example: "sensor.general_power"
    duration:
      name: Duration
      description: For how long the instant power information will be sent.
      example: "60"

turn_on_timed:
  name: Turn on timed
  description: Turn on a light or switch with a hardware-offloaded SCS bus timer that turns off automatically even if Home Assistant restarts.
  target:
    entity:
      domain:
        - light
        - switch
  fields:
    duration:
      name: Duration
      description: Duration in seconds before the device turns off automatically.
      example: 120
      selector:
        number:
          min: 0.5
          max: 918000
          step: 0.5
          unit_of_measurement: seconds
          mode: box
    hours:
      name: Hours
      description: Optional hours component for custom timer duration (0-255).
      example: 0
      selector:
        number:
          min: 0
          max: 255
          mode: box
    minutes:
      name: Minutes
      description: Optional minutes component for custom timer duration (0-59).
      example: 2
      selector:
        number:
          min: 0
          max: 59
          mode: box
    seconds:
      name: Seconds
      description: Optional seconds component for custom timer duration (0-59).
      example: 30
      selector:
        number:
          min: 0
          max: 59
          step: 0.5
          mode: box
    brightness:
      name: Brightness
      description: Optional brightness level (1-255) for lights.
      example: 255
      selector:
        number:
          min: 1
          max: 255
          mode: slider
    brightness_pct:
      name: Brightness percentage
      description: Optional brightness percentage (1-100%) for lights.
      example: 100
      selector:
        number:
          min: 1
          max: 100
          mode: slider

sweep_bus:
  name: Sweep bus status
  description: Triggers an active read-only status query across all bus subsystems (lighting, covers, thermoregulation, clock, and gateway diagnostics) to populate the diagnostic bus monitor ring buffer.
  fields:
    gateway:
      name: Gateway
      description: The gateway's MAC address (optional; defaults to all active gateways).
      example: "00:03:50:00:00:01"
      selector:
        text:

calibrate_cover:
  name: Calibrate cover travel time
  description: >-
    Measures a timed cover's up and down travel times on the SCS bus and stores them.
    The cover is driven fully up, then fully down (timed), then fully up again (timed).
    Covers are calibrated one at a time per gateway. Do not run while the shutter must stay put.
  target:
    entity:
      domain: cover
      integration: myhome

stop_cover_calibration:
  name: Stop cover calibration
  description: >-
    Stops the running travel-time calibration and cancels the queued ones. The moving
    cover is stopped; nothing is stored. Without a gateway every gateway is stopped.
  fields:
    gateway:
      name: Gateway
      description: The gateway's MAC address (optional; defaults to all gateways).
      example: "00:03:50:20:00:01"
      selector:
        text:

set_cover_travel_time:
  name: Set cover travel time
  description: >-
    Stores the physical travel times of a timed cover by hand (measured with a stopwatch)
    instead of calibrating on the bus. Values are kept in the config entry, survive
    restarts and apply to discovered covers without YAML.
  target:
    entity:
      domain: cover
      integration: myhome
  fields:
    travel_time:
      name: Travel time
      description: Seconds for a full travel in both directions (1-180). Used for whichever direction has no explicit value.
      example: 24.5
      selector:
        number:
          min: 1
          max: 180
          step: 0.1
          unit_of_measurement: s
          mode: box
    travel_time_down:
      name: Travel time down
      description: Seconds for a full closing run (1-180).
      example: 24.5
      selector:
        number:
          min: 1
          max: 180
          step: 0.1
          unit_of_measurement: s
          mode: box
    travel_time_up:
      name: Travel time up
      description: Seconds for a full opening run (1-180).
      example: 26.0
      selector:
        number:
          min: 1
          max: 180
          step: 0.1
          unit_of_measurement: s
          mode: box
    copied_from:
      name: Copied from
      description: The cover these times were taken from; the source is then reported as "copied" instead of "manual".
      example: cover.living_room_west
      selector:
        entity:
          domain: cover
          integration: myhome

reset_cover_travel_time:
  name: Reset cover travel time
  description: >-
    Forgets the measured or manually set travel times of a timed cover and returns to the
    myhome.yaml travel_time or the 25 s default.
  target:
    entity:
      domain: cover
      integration: myhome
