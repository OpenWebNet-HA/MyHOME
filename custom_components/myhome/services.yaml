sync_time:
  name: Syncronize time
  description: Syncronize gateway's time to HA local time.
  fields:
    gateway:
      name: Gateway
      description: The gateway's MAC address, as present in the config.
      example: 00:03:50:00:00:00

send_message:
  name: Send message
  description: Send an arbitrary (but valid) OpenWebNet message to the gateway.
  fields:
    gateway:
      name: Gateway
      description: The gateway's MAC address, as present in the config.
      example: 00:03:50:00:00:00
    message:
      name: Message
      description: Valid OpenWebNet message.
      example: "*1*0*0##"

start_sending_instant_power:
  name: Start sending instant power
  description: Get automatic instant power draw updates for a sensor.
  fields:
    entity_id:
      name: Entity
      description: Name(s) of entities that will start sending instant power information.
      example: "sensor.general_power"
    duration:
      name: Duration
      description: For how long the instant power information will be sent.
      example: "60"

turn_on_timed:
  name: Turn on timed
  description: Turn on a light or switch with a hardware-offloaded SCS bus timer that turns off automatically even if Home Assistant restarts.
  target:
    entity:
      domain:
        - light
        - switch
  fields:
    duration:
      name: Duration
      description: Duration in seconds before the device turns off automatically.
      example: 120
      selector:
        number:
          min: 0.5
          max: 918000
          step: 0.5
          unit_of_measurement: seconds
          mode: box
    hours:
      name: Hours
      description: Optional hours component for custom timer duration (0-255).
      example: 0
      selector:
        number:
          min: 0
          max: 255
          mode: box
    minutes:
      name: Minutes
      description: Optional minutes component for custom timer duration (0-59).
      example: 2
      selector:
        number:
          min: 0
          max: 59
          mode: box
    seconds:
      name: Seconds
      description: Optional seconds component for custom timer duration (0-59).
      example: 30
      selector:
        number:
          min: 0
          max: 59
          step: 0.5
          mode: box
    brightness:
      name: Brightness
      description: Optional brightness level (1-255) for lights.
      example: 255
      selector:
        number:
          min: 1
          max: 255
          mode: slider
    brightness_pct:
      name: Brightness percentage
      description: Optional brightness percentage (1-100%) for lights.
      example: 100
      selector:
        number:
          min: 1
          max: 100
          mode: slider

sweep_bus:
  name: Sweep bus status
  description: Triggers an active read-only status query across all bus subsystems (lighting, covers, thermoregulation, clock, and gateway diagnostics) to populate the diagnostic bus monitor ring buffer.
  fields:
    gateway:
      name: Gateway
      description: The gateway's MAC address (optional; defaults to all active gateways).
      example: "00:03:50:20:00:01"
      selector:
        text:

