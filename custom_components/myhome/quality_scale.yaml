# Home Assistant Integration Quality Scale audit manifest for MyHOME
# Reference: https://developers.home-assistant.io/docs/core/integration-quality-scale/
#
# Every rule of the official scale is listed. A tier is reached only when every rule of
# that tier and of all lower tiers is `done` or `exempt`; `scripts/quality_scale_report.py`
# computes the tier reached and the rules blocking the next one (run in CI by the
# "Integration Quality Scale" workflow). Keep statuses honest: `todo` beats a wrong `done`.

rules:
  # 🥉 Bronze
  action-setup:
    status: done
    comment: Services are registered once in async_setup (services.py) and stay registered regardless of config entry state.
  appropriate-polling:
    status: done
    comment: local_push; only temperature sensors poll (5 min) and probes (WHERE >= 100) are receive-only unless the push stream goes silent.
  brands:
    status: done
    comment: Listed in home-assistant/brands with icon and logo (PR home-assistant/brands#2052).
  common-modules:
    status: done
    comment: Base entity in myhome_device.py; gateway handler in gateway.py; shared constants in const.py; the restore / configure / discover / route platform skeleton in discovery.py (every entity platform; button creates its entities from the other platforms' announcements); the per-gateway frame router in router.py that delivers bus frames to the entities owning their addresses.
  config-flow-test-coverage:
    status: done
    comment: tests/test_config_flow.py and test_config_flow_serial.py cover user, SSDP, reauth, reconfigure and error recovery paths (100% statement coverage of config_flow.py).
  config-flow:
    status: done
    comment: ConfigFlow with SSDP discovery, manual entry, serial transport, reauth and reconfigure.
  dependency-transparency:
    status: done
    comment: OWNd is published on PyPI from the public OpenWebNet-HA/OWNd repository with CI; MIT/GPL licensed.
  docs-actions:
    status: done
    comment: docs/configuration/services.md documents all eleven services and their fields (services.yaml, strings.json and icons.json list the same eleven).
  docs-triggers:
    status: done
    comment: docs/configuration/cen_cenplus.md documents CEN / CEN+ device triggers.
  docs-conditions:
    status: exempt
    comment: The integration provides no custom conditions.
  docs-high-level-description:
    status: done
    comment: README.md opens with what the integration does and which hardware it targets.
  docs-installation-instructions:
    status: done
    comment: README.md "Installation & Updating" (terminal, manual, HACS).
  docs-removal-instructions:
    status: done
    comment: README.md "Removing the Integration" covers deleting the entry, removing the code (HACS / manual) and the optional leftovers (myhome.yaml, dashboard resource, automations).
  entity-event-setup:
    status: done
    comment: Entities subscribe to dispatcher signals in async_added_to_hass and unsubscribe via async_on_remove.
  entity-unique-id:
    status: done
    comment: Every entity has a unique_id of the form {gateway mac}-{who}-{where}.
  has-entity-name:
    status: done
    comment: MyHOMEEntity sets has_entity_name=True; primary entities carry the device name (_attr_name None), sensors / binary sensors are named after their device class or entity_name, buttons and energy counters by translation key; no manual entity_id assignment (tests/test_entity_naming.py pins ids and friendly names and the delete / re-add restore).
  runtime-data:
    status: done
    comment: entry.runtime_data holds a typed MyHOMERuntimeData (data.py) set before platforms load; platforms, services, WebSocket API and diagnostics read only it (enforced by verify_ha_standards.py). hass.data[DOMAIN][mac] survives one release as a deprecated alias.
  test-before-configure:
    status: done
    comment: The config flow opens a test session and validates the password before creating the entry.
  test-before-setup:
    status: done
    comment: async_setup_entry runs gateway.test(); failures raise ConfigEntryNotReady, a rejected password raises ConfigEntryAuthFailed.
  unique-config-entry:
    status: done
    comment: Config entry unique_id is the canonical gateway MAC address.

  # 🥈 Silver
  action-exceptions:
    status: done
    comment: Handled in services.py with parameter validation and robust logging.
  config-entry-unloading:
    status: done
    comment: async_unload_entry unloads platforms via async_unload_platforms and closes the gateway sessions; listeners are registered with entry.async_on_unload.
  docs-configuration-parameters:
    status: done
    comment: docs/configuration/gateways.md documents the options flow (worker count, transition mode, event broadcasting, decoders).
  docs-installation-parameters:
    status: done
    comment: docs/configuration/gateways.md documents host, port, password and serial parameters.
  entity-unavailable:
    status: done
    comment: MyHOMEEntity.available follows the gateway availability with a 60 s reconnect grace period.
  integration-owner:
    status: done
    comment: codeowners declared in manifest.json.
  log-when-unavailable:
    status: done
    comment: Grace period and connection supervisor log once on loss and once on recovery, without spamming.
  parallel-updates:
    status: done
    comment: PARALLEL_UPDATES = 0 declared across all 9 platform files for push-driven event streaming.
  reauthentication-flow:
    status: done
    comment: async_setup_entry raises ConfigEntryAuthFailed on password rejection; Home Assistant starts the reauth flow natively.
  test-coverage:
    status: done
    comment: 100.0% statement coverage verified across all integration modules.

  # 🥇 Gold
  devices:
    status: done
    comment: Full DeviceRegistry representation for gateways, actuators, probes, and scenario units.
  diagnostics:
    status: done
    comment: Native diagnostics.py sanitizes credentials and exports gateway and bus telemetry.
  discovery-update-info:
    status: done
    comment: Updates gateway host and port dynamically if IP changes on rediscovery.
  discovery:
    status: done
    comment: Automatically discovers F454, MyHomeServer1, and MH200 gateways via SSDP/UPnP.
  docs-data-update:
    status: done
    comment: docs/configuration/runtime_behaviour.md describes what is pushed by the bus and what is polled.
  docs-examples:
    status: done
    comment: docs/configuration/lovelace_recipes.md and the CEN / CEN+ automation blueprints.
  docs-known-limitations:
    status: done
    comment: docs/configuration/known_limitations.md - per subsystem, with the reason and the workaround.
  docs-supported-devices:
    status: done
    comment: README.md "Supported Hardware" lists gateways and device families.
  docs-supported-functions:
    status: done
    comment: docs/configuration/supported_functions.md - per WHO and per platform, each function marked supported, read-only, via service, or not supported.
  docs-troubleshooting:
    status: done
    comment: docs/configuration/troubleshooting.md - symptom, the identifying log line or frame, and the fix; linked from the README.
  docs-use-cases:
    status: done
    comment: docs/configuration/use_cases.md - nine end-to-end scenarios with the configuration or automation for each.
  dynamic-devices:
    status: done
    comment: PlatformDiscovery (discovery.py) creates an entity from the first frame of an unknown address and routes later frames to it; registry entries are restored first so devices exist before the bus speaks.
  entity-category:
    status: done
    comment: Audited in tests/test_entity_audit.py - lock/unlock and calibration buttons are EntityCategory.CONFIG; every other entity is a primary control or measurement and carries no category (there are no diagnostic entities).
  entity-device-class:
    status: done
    comment: Audited in tests/test_entity_audit.py - switch (switch/outlet), cover (shutter), binary sensors, sensors (power/energy/temperature/illuminance) and media player (speaker) declare device classes; light, climate, button and alarm panel have none applicable.
  entity-disabled-by-default:
    status: done
    comment: Audited in tests/test_entity_audit.py - the daily and monthly energy counters are disabled by default; all other entities are primary controls and stay enabled.
  entity-translations:
    status: done
    comment: Translation keys for the lock / unlock / calibration buttons and the energy counters under `entity` in strings.json and translations/en.json; device-class-named sensors and binary sensors use Home Assistant's own translations.
  exception-translations:
    status: done
    comment: HomeAssistantError/ServiceValidationError raised from cover calibration, travel-time services and the media player decoder proxy carry translation keys defined under `exceptions` in strings.json / translations/en.json (guarded by test_every_raised_translation_key_is_defined).
  icon-translations:
    status: done
    comment: icons.json established for service actions and platform icons.
  reconfiguration-flow:
    status: done
    comment: async_step_reconfigure implemented allowing in-place IP, port, and password updates.
  repair-issues:
    status: done
    comment: gateway.py raises gateway_identity_mismatch / gateway_identity_corrected repair issues when the WHO=13 device type contradicts the configured model, and clears them when they agree; password rejection uses ConfigEntryAuthFailed (native reauth repair).
  stale-devices:
    status: done
    comment: Empty orphaned devices are pruned at setup; async_remove_config_entry_device lets the user delete any bus device (a device still wired in reappears on its next status frame) and refuses only the gateway device.

  # 🏆 Platinum
  async-dependency:
    status: done
    comment: OWNd client library is 100% native non-blocking asyncio protocols and streams.
  inject-websession:
    status: exempt
    comment: No HTTP is used; communication is via raw TCP OpenWebNet sockets.
  strict-typing:
    status: done
    comment: mypy --strict is ratcheted per module by scripts/typing_ratchet.py against mypy_baseline.json; 0 errors remain in all modules. OWNd ships py.typed (PEP 561) as of 2.0.0b7.
