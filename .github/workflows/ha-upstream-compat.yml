name: Upstream Home Assistant Compatibility

on:
  push:
    branches: [main, master, "v2-*"]
  schedule:
    - cron: "0 3 * * *"  # Daily run at 03:00 UTC to catch upstream HA beta and dev cuts
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ha-compatibility:
    name: HA Compatibility (${{ matrix.ha-channel }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    continue-on-error: ${{ matrix.allow-failure }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # stable: the core pinned by the latest pytest-homeassistant-custom-component
          - ha-channel: stable
            pip-install: "pytest-homeassistant-custom-component"
            allow-failure: false
          - ha-channel: beta
            pip-install: "--pre homeassistant"
            allow-failure: false
          - ha-channel: dev
            pip-install: "git+https://github.com/home-assistant/core.git@dev"
            allow-failure: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install Home Assistant (${{ matrix.ha-channel }}) & test requirements
        shell: bash
        env:
          HA_CHANNEL: ${{ matrix.ha-channel }}
          PIP_INSTALL: ${{ matrix.pip-install }}
        run: |
          python -m pip install --upgrade pip
          # PIP_INSTALL may hold several words ("--pre homeassistant").
          read -ra ha_pkg <<< "$PIP_INSTALL"
          pip install "${ha_pkg[@]}"
          HA_CONSTRAINTS=$(python -c 'import homeassistant, os; print(os.path.join(os.path.dirname(homeassistant.__file__), "package_constraints.txt"))')
          CONSTRAINT_ARGS=()
          if [ -f "$HA_CONSTRAINTS" ]; then
            echo "PIP_CONSTRAINT=$HA_CONSTRAINTS" >> "$GITHUB_ENV"
            CONSTRAINT_ARGS=(-c "$HA_CONSTRAINTS")
          fi
          pip install "${CONSTRAINT_ARGS[@]}" pytest pytest-asyncio pytest-cov pytest-socket pytest-freezer execnet syrupy time-machine python-dateutil pytz freezegun requests-mock respx paho-mqtt tqdm jsonschema pyyaml
          if [ "$HA_CHANNEL" != "stable" ]; then
            pip install pytest-homeassistant-custom-component --no-deps
            # Seed translations/en.json for git installs (no-op for wheels) and
            # bridge symbol moves between HA beta/dev and the latest PyPI
            # pytest-homeassistant-custom-component wheel.
            python scripts/seed_core_translations.py
          fi
          python -c "import homeassistant.const as c; print('Home Assistant', c.__version__)"

      - name: Fast Platform Import Smoke Test
        run: |
          PYTHONPATH=. pytest tests/test_platforms.py -k "TestPlatformImportCleanliness" -v

      - name: Run the full test suite
        run: |
          PYTHONPATH=. pytest tests/ -q --maxfail=25
