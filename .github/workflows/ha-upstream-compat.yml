name: Upstream Home Assistant Compatibility

on:
  push:
    branches: [main, master, "v2-*"]
  schedule:
    - cron: "0 3 * * 1"  # Weekly run every Monday at 03:00 UTC
  workflow_dispatch:
  pull_request:
    branches: [main, master, "v2-*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ha-compatibility:
    name: HA Compatibility (${{ matrix.ha-channel }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    continue-on-error: ${{ matrix.allow-failure }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # stable: the core pinned by the latest pytest-homeassistant-custom-component
          - ha-channel: stable
            pip-install: "pytest-homeassistant-custom-component"
            allow-failure: false
          - ha-channel: beta
            pip-install: "--pre homeassistant"
            allow-failure: false
          - ha-channel: dev
            pip-install: "git+https://github.com/home-assistant/core.git@dev"
            allow-failure: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install Home Assistant (${{ matrix.ha-channel }}) & test requirements
        id: install-deps
        shell: bash
        env:
          HA_CHANNEL: ${{ matrix.ha-channel }}
          PIP_INSTALL: ${{ matrix.pip-install }}
        run: |
          python -m pip install --upgrade pip
          # PIP_INSTALL may hold several words ("--pre homeassistant").
          read -ra ha_pkg <<< "$PIP_INSTALL"
          if [ "$HA_CHANNEL" = "dev" ]; then
            if ! pip install "${ha_pkg[@]}"; then
              echo "::warning title=HA Dev Channel Incompatible::Upstream home-assistant/core@dev could not be installed (new Python requirement?). Skipping dev tests."
              echo "installed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # The git tree has no translations/en.json (generated at release time);
            # without it, entities named after their device class have no name.
            python scripts/seed_core_translations.py
          else
            pip install "${ha_pkg[@]}"
          fi
          pip install pytest pytest-asyncio pytest-cov pytest-socket execnet syrupy time-machine python-dateutil pytz freezegun requests-mock respx paho-mqtt tqdm jsonschema pyyaml
          if [ "$HA_CHANNEL" != "stable" ]; then
            pip install pytest-homeassistant-custom-component --no-deps
          fi
          python -c "import homeassistant.const as c; print('Home Assistant', c.__version__)"
          echo "installed=true" >> "$GITHUB_OUTPUT"

      - name: Fast Platform Import Smoke Test
        if: steps.install-deps.outputs.installed == 'true'
        run: |
          PYTHONPATH=. pytest tests/test_platforms.py -k "TestPlatformImportCleanliness" -v

      - name: Run the full test suite
        if: steps.install-deps.outputs.installed == 'true'
        run: |
          PYTHONPATH=. pytest tests/ -q
