name: Validate with hassfest

# Pushes to topic branches are covered by their pull request; running on both
# only doubled every run.
on:
  push:
    branches: [main, master, "v2-*"]
  pull_request:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Required check on master (together with validate.yml): keep the job id.
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read # pull the hassfest image from ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull hassfest container with retry
        shell: bash
        run: |
          for i in {1..5}; do
            echo "Attempt $i: Pulling ghcr.io/home-assistant/hassfest:latest..."
            if docker pull ghcr.io/home-assistant/hassfest:latest; then
              break
            fi
            echo "Pull failed (attempt $i), waiting 5s before retry..."
            sleep 5
          done
      # Deliberately @master (allowed in .github/zizmor.yml): hassfest has no
      # releases, and it must enforce the rules of the Home Assistant core
      # users are on now.
      - uses: home-assistant/actions/hassfest@master
