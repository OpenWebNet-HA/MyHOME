name: Validate with hassfest

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

jobs:
  validate:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v7"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull hassfest container with retry
        shell: bash
        run: |
          for i in {1..5}; do
            echo "Attempt $i: Pulling ghcr.io/home-assistant/hassfest:latest..."
            docker pull ghcr.io/home-assistant/hassfest:latest && break || {
              echo "Pull failed (attempt $i), waiting 5s before retry..."
              sleep 5
            }
          done
      - uses: home-assistant/actions/hassfest@master

