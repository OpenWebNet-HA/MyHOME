name: Music Assistant contract

on:
  schedule:
    - cron: "0 4 * * 1"  # Weekly, Monday 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ma-contract:
    name: hass_players anchors
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Check upstream Music Assistant still makes the calls MyHOME relies on
        run: python scripts/check_ma_contract.py
