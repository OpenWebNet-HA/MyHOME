name: Crowdin Translation Sync

on:
  push:
    branches: ["v2-phase1-architecture"]
    paths:
      - "custom_components/myhome/translations/en.json"
      - "custom_components/myhome/strings.json"
  schedule:
    - cron: "0 2 * * 0" # Weekly on Sunday at 02:00 UTC
  workflow_dispatch:
    inputs:
      upload_sources:
        description: "Upload English source strings (en.json) to Crowdin"
        required: true
        type: boolean
        default: true
      upload_translations:
        description: "Upload existing translations (nl, fr, it) to seed Crowdin (run once)"
        required: false
        type: boolean
        default: false
      download_translations:
        description: "Download approved translated strings from Crowdin"
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  crowdin:
    name: Synchronize with Crowdin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check Crowdin credentials
        id: check_creds
        run: |
          if [ -z "${{ secrets.CROWDIN_PROJECT_ID }}" ] || [ -z "${{ secrets.CROWDIN_PERSONAL_TOKEN }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Crowdin credentials (CROWDIN_PROJECT_ID, CROWDIN_PERSONAL_TOKEN) are not set. Skipping Crowdin sync."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Crowdin Action
        if: steps.check_creds.outputs.configured == 'true'
        uses: crowdin/github-action@e4a6c1338b4063c77d46a81875265f9e8bd76f95 # v3.0.0
        with:
          upload_sources: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.upload_sources) }}
          upload_translations: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_translations }}
          download_translations: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.download_translations) }}
          skip_untranslated_strings: true
          export_only_approved: true
          create_pull_request: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.download_translations) }}
          pull_request_title: "chore(translations): update community translations from Crowdin"
          pull_request_body: "Automated pull request generated by Crowdin GitHub Action with approved community translations."
          pull_request_base_branch_name: "v2-phase1-architecture"
          localization_branch_name: "l10n_crowdin_v2"
          commit_message: "chore(translations): sync community translations from Crowdin"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
