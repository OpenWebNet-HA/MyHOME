name: panel-tests

on:
  push:
    branches: [main, master, "v2-*"]
    paths:
      - "custom_components/myhome/frontend/**"
      - "tests/frontend/**"
      - "package*.json"
      - ".github/workflows/panel-tests.yml"
  pull_request:
    paths:
      - "custom_components/myhome/frontend/**"
      - "tests/frontend/**"
      - "package*.json"
      - ".github/workflows/panel-tests.yml"

permissions:
  contents: read

jobs:
  panel-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run test:panel
