name: OWNd Protocol Engine Smoke Test

on:
  push:
    branches:
      - main
      - master
      - "v2-*"
      - "feat/*"
  pull_request:
    branches:
      - main
      - master
      - "v2-*"
  schedule:
    - cron: "0 5 * * 1"  # Weekly run every Monday at 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ownd-smoke:
    name: OWNd (${{ matrix.ownd-target }} / Py${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
        ownd-target: [pinned, latest, dev]
        include:
          - ownd-target: pinned
            allow-failure: false
          - ownd-target: latest
            allow-failure: false
          - ownd-target: dev
            allow-failure: true

    continue-on-error: ${{ matrix.allow-failure }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install homeassistant
          pip install pytest pytest-asyncio pytest-cov pytest-socket execnet syrupy time-machine python-dateutil pytz freezegun requests-mock respx paho-mqtt tqdm jsonschema pyyaml packaging

      - name: Run OWNd Smoke Test (${{ matrix.ownd-target }})
        env:
          OWND_TARGET: ${{ matrix.ownd-target }}
        run: |
          python scripts/run_ownd_smoke.py --target "$OWND_TARGET"
