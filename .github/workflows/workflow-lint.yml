name: workflow-lint

# Lints the workflows themselves:
#   zizmor      security: unpinned actions, ${{ }} injection into run scripts,
#               persisted credentials, over-broad permissions, cache poisoning
#   actionlint  correctness: expression/type errors, unknown inputs, plus
#               shellcheck on every run block
# Both versions are pinned; actionlint's download is verified by SHA-256.

on:
  push:
    branches: [main, master, "v2-*"]
    paths: [".github/**"]
  pull_request:
    paths: [".github/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflow-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: zizmor
        run: |
          pip install zizmor==1.30.1
          # The whole repo, so dependabot.yml is audited too. --config: zizmor
          # does not discover .github/zizmor.yml on its own here.
          zizmor --offline --format=github --config .github/zizmor.yml .
      - name: actionlint (+ shellcheck)
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          tgz="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSLo "$tgz" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $tgz" | sha256sum -c -
          tar -xzf "$tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
