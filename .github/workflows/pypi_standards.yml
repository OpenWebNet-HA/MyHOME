name: PyPI Standards & Packaging

on:
  push:
    branches: [main, master, "v2-*"]
  pull_request:
    branches: [main, master, "v2-*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  packaging-standards:
    # Required check on master: keep this name.
    name: Validate PyPI Packaging Standards
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install packaging tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine "validate-pyproject[all]" check-wheel-contents

      - name: Validate pyproject.toml standards
        run: |
          validate-pyproject pyproject.toml

      - name: Build sdist and wheel
        run: |
          python -m build

      - name: Strict twine distribution check
        run: |
          twine check --strict dist/*

      - name: Check wheel hygiene
        run: |
          check-wheel-contents dist/*.whl

      - name: Verify integration assets in wheel
        run: |
          python -c "import zipfile, glob; whl = glob.glob('dist/*.whl')[0]; z = zipfile.ZipFile(whl); files = z.namelist(); assert any('manifest.json' in f for f in files), f'manifest.json missing from {whl}'; assert any('en.json' in f for f in files), f'translations missing from {whl}'; print('Integration wheel assets verified successfully!')"

      - name: Upload distribution packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-packages
          path: dist/*
          retention-days: 7

  unit-tests-and-coverage:
    name: Run Pytest Suite & Coverage (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # Tries the OWNd branch named like this one first, so a paired OWNd + MyHOME
      # change is tested together. The branch name reaches the shell through env,
      # never through ${{ }}: on a fork PR it is chosen by the PR author.
      - name: Install test dependencies
        env:
          OWND_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]" homeassistant python-dateutil pytz pytest-socket
          pip install --upgrade --force-reinstall "git+https://github.com/OpenWebNet-HA/OWNd.git@${OWND_REF}" \
            || pip install --upgrade --force-reinstall "git+https://github.com/OpenWebNet-HA/OWNd.git@master"

      - name: Run test suite with coverage tracking
        run: |
          pytest --cov=custom_components.myhome --cov-report=xml --cov-report=term-missing tests/

      - name: Enforce 100% test coverage on ownd core
        run: |
          python scripts/verify_ownd_coverage.py

      - name: Upload coverage report
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7
