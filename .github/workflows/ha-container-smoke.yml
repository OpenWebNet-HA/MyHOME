name: Home Assistant Container Smoke Test

on:
  push:
    branches:
      - main
      - master
      - "v2-*"
      - "feat/*"
  pull_request:
  schedule:
    - cron: "0 4 * * *"  # Daily run at 04:00 UTC to catch upstream HA beta and dev container images
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ha-container-smoke:
    name: HA Container (${{ matrix.ha-channel }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - ha-channel: stable
            allow-failure: false
          - ha-channel: beta
            allow-failure: false
          - ha-channel: dev
            allow-failure: false

    continue-on-error: ${{ matrix.allow-failure }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Run Container Smoke Test (${{ matrix.ha-channel }})
        env:
          HA_CHANNEL: ${{ matrix.ha-channel }}
          OWND_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          python scripts/run_ha_container_smoke.py --channel "$HA_CHANNEL"
