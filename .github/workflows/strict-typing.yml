name: strict-typing

# Integration Quality Scale rule strict-typing: `mypy --strict` over the integration,
# ratcheted per module by scripts/typing_ratchet.py against mypy_baseline.json.
# A module may only ever get cleaner; the run fails when any module regresses.

on:
  push:
    branches: [main, master, "v2-*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mypy-ratchet:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install Home Assistant (pinned by pytest-homeassistant-custom-component), pinned OWNd, and mypy
        # OWNd is the exact `OWNd==` pin from manifest.json, so mypy checks the
        # integration against the types users install (falling back to the paired
        # OWNd branch only when the pinned pre-release has not been published to PyPI yet).
        env:
          OWND_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          python -m pip install --upgrade pip
          OWND_PIN=$(python -c "import json; print(next(r for r in json.load(open('custom_components/myhome/manifest.json'))['requirements'] if r.startswith('OWNd==')))")
          OWND_VER="${OWND_PIN#OWNd==}"
          pip install pytest-homeassistant-custom-component
          HA_CONSTRAINTS=$(python -c 'import homeassistant, os; print(os.path.join(os.path.dirname(homeassistant.__file__), "package_constraints.txt"))')
          pip install -c "$HA_CONSTRAINTS" mypy
          if ! pip install -c "$HA_CONSTRAINTS" "$OWND_PIN"; then
            IS_RELEASED=$(OWND_VER="$OWND_VER" python -c "import json, os, urllib.request; ver = os.environ['OWND_VER']; req = urllib.request.Request('https://pypi.org/pypi/OWNd/json', headers={'User-Agent': 'MyHOME-Typing-CI'}); data = json.loads(urllib.request.urlopen(req, timeout=10).read().decode('utf-8')); print('1' if ver in data.get('releases', {}) else '0')" 2>/dev/null || echo "0")
            if [ "$IS_RELEASED" = "1" ]; then
              echo "::error::Failed to install published $OWND_PIN from PyPI."
              exit 1
            fi
            echo "::notice::Pinned $OWND_PIN is not yet on PyPI; falling back to paired OWNd branch ($OWND_REF / master) for strict-typing."
            pip install -c "$HA_CONSTRAINTS" "git+https://github.com/OpenWebNet-HA/OWNd.git@${OWND_REF}" \
              || pip install -c "$HA_CONSTRAINTS" "git+https://github.com/OpenWebNet-HA/OWNd.git@master"
          fi
          python -c "import homeassistant.const as c, OWNd; print('Home Assistant', c.__version__, '| OWNd', OWNd.__version__)"

      - name: mypy --strict ratchet
        # `shell: bash` (not the default) so the step runs with `pipefail`: without it
        # `| tee` returns 0 and a ratchet failure never turns the job red.
        shell: bash
        run: python scripts/typing_ratchet.py | tee mypy-ratchet.txt

      - name: Summary
        if: always()
        run: |
          {
            echo '## 🧷 strict-typing ratchet'
            echo '```'
            if [ -f mypy-ratchet.txt ]; then
              cat mypy-ratchet.txt
            else
              echo '(mypy-ratchet did not produce output)'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
