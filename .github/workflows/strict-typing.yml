name: strict-typing

# Integration Quality Scale rule strict-typing: `mypy --strict` over the integration,
# ratcheted per module by scripts/typing_ratchet.py against mypy_baseline.json.
# A module may only ever get cleaner; the run fails when any module regresses.

on:
  push:
    branches: [main, master, "v2-*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mypy-ratchet:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install Home Assistant (pinned by pytest-homeassistant-custom-component) and mypy
        run: |
          python -m pip install --upgrade pip
          pip install pytest-homeassistant-custom-component mypy
          python -c "import homeassistant.const as c; print('Home Assistant', c.__version__)"

      - name: mypy --strict ratchet
        # `shell: bash` (not the default) so the step runs with `pipefail`: without it
        # `| tee` returns 0 and a ratchet failure never turns the job red.
        shell: bash
        run: python scripts/typing_ratchet.py | tee mypy-ratchet.txt

      - name: Summary
        if: always()
        run: |
          {
            echo '## 🧷 strict-typing ratchet'
            echo '```'
            cat mypy-ratchet.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
