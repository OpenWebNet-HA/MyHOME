name: "🔊 Audio field report (Music Assistant / F441)"
description: "Report how multi-room audio behaves on your plant. Passing runs count too."
title: "[Audio]: "
labels: ["audio", "field-report"]
body:
  - type: markdown
    attributes:
      value: |
        ## Audio field report

        Grouping is where Music Assistant and the analog matrix meet, and each plant behaves a little differently.
        The four checks below are the ones we replay as tests. Please write in **English** and attach the **diagnostics file**
        (*Settings → Devices & services → MyHOME → ⋮ → Download diagnostics*), a **MyHOME Bus Monitor trace** (`💾 Export Trace` / `📋 Copy Trace`), or relevant logs/screenshots (or explain if a trace cannot be collected).

  - type: input
    id: plant
    attributes:
      label: Plant (Gateway model, Firmware, Matrix & Decoders)
      description: Gateway model & firmware (or "unknown / unavailable"), matrix (F441 / F441M), number of zones, decoder(s).
      placeholder: "MH200 (FW 2.1.2, or 'unknown / unavailable') + F441M, 6 zones, Squeezelite + Cambridge CXN"
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Versions
      description: MyHOME (e.g. 2.0.0b16), Home Assistant, and Music Assistant versions.
      placeholder: "MyHOME 2.0.0b16, HA 2026.10.1, Music Assistant 2.x"
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Which checks passed?
      description: Tick what worked. Leave unticked what did not, and describe it below.
      options:
        - label: "Played to the Music Assistant Sync Group, added a third room, dropped the leader: matrix and queue stayed in step"
        - label: "Volume of one member set to 0 and raised again: the slider did not lock"
        - label: "After the anti-hiss auto-off silenced the house, play brought the parked members back as a group"
        - label: "Cambridge decoder only: diagnostics show the DLNA/UPnP renderer as companion, not a Music Assistant clone"

  - type: textarea
    id: what_happened
    attributes:
      label: What you did, and when (plus attached Diagnostics / Bus Trace / Logs)
      description: |
        Describe what happened and drag & drop your **Diagnostics JSON**, **MyHOME Bus Monitor** trace export, or relevant logs/screenshots here (or explain why a trace cannot be collected).

        > 🔒 **Privacy note:** **Bus Monitor** exports (`💾 Export Trace` / `📋 Copy Trace`) omit passwords, LAN IPs/ports, serial paths, and full MAC addresses (keeping the 3-byte OUI prefix) while including environment/gateway metadata, telemetry, and raw frames. **Download diagnostics** JSON redacts config-entry secrets and network/hardware identifiers (`password`, `pin`, `token`, `secret`, `host`, full `mac`/`id`, `UDN`, `ssdp_location`, `friendly_name`, `file_path`, and peer MACs) and aliases audio zones/decoders (`zone_<WHERE>`, `decoder_<slot>`), but retains metadata/telemetry and—for configured `expose` bindings—`entity_id` (which may contain personal or room names) and `current_ha_state`. **Ordinary Home Assistant or Music Assistant debug logs do not carry the same redaction guarantees.** Please review attachments before posting.
      placeholder: "For example: 21:48, pressed play on the Huis group, Bureau's slider would not move. (Drag & drop myhome_diagnostics.json, myhome_trace_*.json, or logs here)"
    validations:
      required: true

  - type: checkboxes
    id: preflight_checklist
    attributes:
      label: "🛑 Before Submitting — Did You Check?"
      options:
        - label: "I have written this report in English and attached a MyHOME Diagnostics JSON, Bus Monitor trace, or relevant log/screenshot (or explained why a trace cannot be collected)."
          required: true
