name: "🐛 Bug Report"
description: "File a bug report or defect with the MyHOME integration."
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ## Thank you for helping improve MyHOME!

        Before submitting, please keep these three rules in mind:
        1. **🇬🇧 English Only**: Please write your issue in **English** so everyone in the community can follow along.
        2. **🔬 Trace & Diagnostic Evidence**: The v2 Phase 1 rewrite is built on **real OpenWebNet bus traces** from actual hardware rather than guessing protocol behavior. For bus or device issues, please provide your MyHOME version, gateway model & firmware (or `"unknown / unavailable"`), and a Bus Monitor trace, Diagnostics JSON, or debug log. For setup failures, startup exceptions, or frontend/UI issues where bus frames are unavailable or irrelevant, please attach the relevant logs, Python tracebacks, or screenshots (or explain why a trace cannot be collected).
        3. **🔒 Privacy & Redaction Note**:
           - **MyHOME Bus Monitor** trace exports (`💾 Export Trace` / `📋 Copy Trace`) omit passwords, PINs, tokens, LAN IP addresses/ports, serial device paths, and full MAC addresses (keeping only the 3-byte OUI prefix), while including environment versions, capture/filter metadata, gateway model/firmware/identification, buffer/queue telemetry, and raw OpenWebNet bus frames.
           - **Download diagnostics** JSON redacts config-entry secrets and network/hardware identifiers (`password`, `pin`, `token`, `secret`, `host`, full `mac`/`id`, `UDN`, `ssdp_location`, `friendly_name`, `file_path`, and peer gateway MACs) and aliases audio zones/decoders (`zone_<WHERE>`, `decoder_<slot>`). It also includes gateway/profile/queue/topology metadata, platform device counts, recent bus frames, and—if `expose` bindings are configured—the exposed `entity_id` (which may contain user-defined room or personal names) and its `current_ha_state`.
           - **Ordinary Home Assistant debug logs (`.log` / `.zip`)** do **not** carry the same redaction guarantees and may contain IP addresses, entity IDs, or other household details. Always review your attachments and pasted snippets before posting publicly.

        ---

        ### ⚡ How to capture bus traces, diagnostics, or logs:
        1. **MyHOME Bus Monitor Trace** *(Recommended for bus/device issues)*:
           Open the **MyHOME Bus Monitor** card/panel (`<myhome-bus-card>`), click **Start Trace** (or **Clear**), reproduce the action (both from the physical BTicino control/Home Touch and from Home Assistant), then click **"💾 Export Trace"** (to download a `.json` file) or **"📋 Copy Trace"** (to copy to clipboard).
        2. **Home Assistant Diagnostics JSON** *(Redacted config & runtime snapshot)*:
           Go to **Settings ➔ Devices & Services ➔ MyHOME ➔ ⋮ (3 dots) ➔ Download diagnostics** and drag & drop the JSON file into the attachment box below.
        3. **Home Assistant Debug Log / Tracebacks / Screenshots** *(For setup failures, startup crashes, or UI issues)*:
           Go to **Settings ➔ Devices & Services ➔ MyHOME ➔ Enable debug logging** (or **Settings ➔ System ➔ Logs**), reproduce the issue, and drag & drop the `.log` file, traceback, or screenshot below. *(Note: ordinary debug logs are not automatically redacted.)*

        ---

  - type: textarea
    id: description
    attributes:
      label: Bug Description (in English)
      description: A clear and concise description of what went wrong, what you observed, and what you expected.
      placeholder: What went wrong? Does the device work from a physical wall switch or BTicino Home Touch, and what happens in Home Assistant?
    validations:
      required: true

  - type: dropdown
    id: gateway_model
    attributes:
      label: Gateway Model
      description: Select your BTicino / Legrand OpenWebNet gateway hardware model.
      options:
        - "MyHomeServer1 (MHS1)"
        - "F454 (Audio/Video Web Server)"
        - "F455 (Basic Gateway)"
        - "F460 (MyHOME Server)"
        - "F461 (Third-Party Integration Server)"
        - "MH200N (Scenario Programmer)"
        - "MH202 (Scenario Programmer)"
        - "MH200 (Scenario Programmer)"
        - "MH201 (IP Gateway)"
        - "H4684 / AM4890 / LN4890 (Touch Screen Gateway)"
        - "F452 / F453 / F453AV (Web Server)"
        - "F459 (Integration Gateway)"
        - "Legrand 3578 USB/Serial (Serial Interface)"
        - "Other / Custom OpenWebNet Server"
    validations:
      required: true

  - type: input
    id: gateway_firmware
    attributes:
      label: Gateway Firmware Version
      description: The firmware version of your OpenWebNet gateway (shown on the gateway device page in HA or in your Diagnostics / Bus Monitor export). Enter "unknown" or "unavailable" if setup fails before identification or you cannot access it.
      placeholder: "e.g. 2.0.51, 3.1.8, 1.0.24, or 'unknown / unavailable'"
    validations:
      required: true

  - type: dropdown
    id: connection_type
    attributes:
      label: Connection Type
      description: How is Home Assistant communicating with your OpenWebNet gateway?
      options:
        - "Ethernet / IP (TCP port 20000, HMAC-SHA2 / SHA1 / OPEN password)"
        - "Ethernet / IP (TCP port 20000, unencrypted / IP range whitelist)"
        - "USB / Serial (RS-232 / USB-to-serial adapter, e.g. Legrand 3578)"
        - "Virtual / TCP Tunnel"
        - "Other"
    validations:
      required: true

  - type: input
    id: ha_version
    attributes:
      label: Home Assistant Version
      description: Find this under Settings -> About (e.g. 2026.10.1).
      placeholder: "e.g. 2026.10.1"
    validations:
      required: true

  - type: input
    id: integration_version
    attributes:
      label: MyHOME Integration Version
      description: Exact version of the MyHOME integration (please verify on the latest v2 Phase 1 beta release, e.g. 2.0.0b16).
      placeholder: "e.g. 2.0.0b16"
    validations:
      required: true

  - type: textarea
    id: reproduction_steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue (and what actions you performed during your bus trace capture, if applicable).
      placeholder: |
        1. Start trace in MyHOME Bus Monitor (or enable debug logging)
        2. Toggle the device from the physical wall switch / BTicino Home Touch -> works
        3. Toggle the entity 'climate.climate_zone_7' in Home Assistant -> nothing happens on the bus...
    validations:
      required: true

  - type: textarea
    id: diagnostic_attachment
    attributes:
      label: "📎 Bus Trace / Diagnostics JSON / Debug Log / Screenshot Attachment"
      description: |
        **Drag & drop files directly into this box** (GitHub supports `.json`, `.log`, `.txt`, `.zip`, `.tar.gz`, `.png`, `.jpg`):
        - 📡 **MyHOME Bus Monitor Trace JSON**: Click **💾 Export Trace** in `<myhome-bus-card>`
        - 📦 **MyHOME Diagnostics JSON**: *Settings ➔ Devices & Services ➔ MyHOME ➔ ⋮ (3 dots) ➔ Download diagnostics*
        - 📋 **Debug Log / Screenshot**: *Settings ➔ Devices & Services ➔ MyHOME ➔ Enable/Disable debug logging* (or *Settings ➔ System ➔ Logs*)

        > 🔒 **Privacy note:** **Bus Monitor** exports omit passwords, LAN IPs/ports, serial paths, and full MAC addresses (keeping the 3-byte OUI prefix) while including environment/gateway metadata, telemetry, and raw frames. **Diagnostics JSON** redacts config-entry secrets and network/hardware identifiers (`password`, `pin`, `token`, `secret`, `host`, full `mac`/`id`, `UDN`, `ssdp_location`, `friendly_name`, `file_path`, and peer MACs) and aliases audio zones/decoders, but retains metadata/telemetry and—for configured `expose` bindings—`entity_id` (which may contain personal or room names) and `current_ha_state`. **Ordinary debug logs do not carry the same redaction guarantees.** Please review attachments before posting.
      placeholder: "Drag and drop your myhome_trace_*.json, myhome_diagnostics.json, home-assistant.log, or screenshot here..."
    validations:
      required: false

  - type: textarea
    id: diagnostic_payload
    attributes:
      label: Bus Monitor Diagnostic Payload / Bus Trace
      description: |
        Or paste the clipboard bundle generated by clicking **"📋 Copy Trace"** in `<myhome-bus-card>` here.

        > 🔒 **Privacy note:** The Bus Monitor bundle omits passwords, LAN IPs/ports, serial device paths, and full MAC addresses (retaining only the 3-byte OUI prefix), and includes environment/gateway metadata, queue/buffer telemetry, and raw OpenWebNet frames. Please review the pasted text before posting.
      render: markdown
      placeholder: "Paste clipboard contents here (starts with ### MyHOME Diagnostic Bundle)..."
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Log Snippets / Python Tracebacks / Why a Trace Is Unavailable
      description: Relevant log entries, startup tracebacks (from Settings -> System -> Logs), or an explanation if a bus trace cannot be collected (e.g. setup failure, startup exception, or frontend issue). Note that ordinary debug logs are not automatically redacted — please review before posting.
      render: text
      placeholder: "Paste relevant traceback or custom_components.myhome / OWNd debug log lines here (or explain why a bus trace is unavailable / not applicable)..."
    validations:
      required: false

  - type: checkboxes
    id: diagnostics_checklist
    attributes:
      label: "🛑 Before Submitting — Did You Check?"
      description: Please confirm all items below so we have the context and evidence needed to investigate and fix your issue.
      options:
        - label: "I have written this issue in English."
          required: true
        - label: "I have specified my MyHOME version (e.g. 2.0.0b16), Home Assistant version, Gateway model, and Gateway firmware version (or 'unknown / unavailable')."
          required: true
        - label: "I have attached or pasted a MyHOME Bus Monitor trace, Diagnostics JSON, or relevant debug log / Python traceback / screenshot (or explained why a bus trace cannot be collected)."
          required: true
