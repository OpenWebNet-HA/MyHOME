name: "🐛 Bug Report"
description: "File a bug report or defect with the MyHOME integration."
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ## Thank you for helping improve MyHOME!

        To help us diagnose and fix issues quickly, please provide diagnostics and logs using any of the following methods:

        ---

        ### ⚡ How to provide diagnostic logs & bundles:
        1. **One-Click Bus Trace Bundle** *(Fastest)*:
           If you use the Lovelace **MyHOME Bus Monitor Card** (`<myhome-bus-card>`), click **"📋 Report Issue / Copy Trace"**. It copies your gateway model, firmware, queue telemetry, and recent bus frames to your clipboard to paste below.
        2. **Home Assistant Diagnostics File**:
           Go to **Settings ➔ Devices & Services ➔ MyHOME ➔ ⋮ (3 dots) ➔ Download diagnostics**. You can drag & drop the downloaded JSON file directly into the attachment box below!
        3. **Home Assistant Full Log or Zip**:
           Go to **Settings ➔ System ➔ Logs ➔ Download full log**. You can drag & drop your `.log` or `.zip` file directly into the attachment box below.

        ---

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: What went wrong? What did you observe versus what did you expect?
    validations:
      required: true

  - type: dropdown
    id: gateway_model
    attributes:
      label: Gateway Model
      description: Select your BTicino / Legrand OpenWebNet gateway hardware model.
      options:
        - "F454 (Audio/Video Gateway)"
        - "F455 (Advanced Gateway)"
        - "MH200 (Scenario Programmer)"
        - "MH200N (Scenario Programmer)"
        - "MH202 (Scenario Programmer)"
        - "AM4890 (Basic Gateway)"
        - "MyHomeServer1 (MHS1)"
        - "Legrand 3578 USB/Serial (Serial Interface)"
        - "F452 / F453AV"
        - "Other / Custom OpenWebNet Server"
    validations:
      required: true

  - type: dropdown
    id: connection_type
    attributes:
      label: Connection Type
      description: How is Home Assistant communicating with your OpenWebNet gateway?
      options:
        - "Ethernet / IP (TCP port 20000, unencrypted OpenWebNet)"
        - "Ethernet / IP (TCP port 20000, HMAC-SHA2 / SHA1 authenticated)"
        - "USB / Serial (RS-232 / USB-to-serial adapter, e.g. Legrand 3578)"
        - "Virtual / TCP Tunnel"
        - "Other"
    validations:
      required: true

  - type: input
    id: ha_version
    attributes:
      label: Home Assistant Version
      description: Find this under Settings -> About (e.g. 2024.9.0).
      placeholder: "e.g. 2024.9.0"
    validations:
      required: true

  - type: input
    id: integration_version
    attributes:
      label: Integration Version
      description: The version or commit of the MyHOME integration.
      placeholder: "e.g. 1.0.0-beta (v2-phase1-architecture)"
    validations:
      required: true

  - type: textarea
    id: reproduction_steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Open Home Assistant dashboard
        2. Toggle switch 'switch.living_room'
        3. Observe that light physically switches on, but state flips back to off after 3 seconds...
    validations:
      required: true

  - type: textarea
    id: diagnostic_attachment
    attributes:
      label: "📎 Diagnostics File / Log File / Zip Attachment"
      description: |
        **Drag & drop files directly into this box** (GitHub supports `.log`, `.txt`, `.json`, `.zip`, `.tar.gz`):
        - 📦 **Diagnostics JSON**: *Settings ➔ Devices & Services ➔ MyHOME ➔ ⋮ (3 dots) ➔ Download diagnostics*
        - 📋 **Full Log File**: *Settings ➔ System ➔ Logs ➔ Download full log* (or zip of `/config/home-assistant.log`)
      placeholder: "Drag and drop your home-assistant.log, .zip, or myhome_diagnostics.json file here..."
    validations:
      required: false

  - type: textarea
    id: diagnostic_payload
    attributes:
      label: Bus Monitor Diagnostic Payload / Bus Trace
      description: |
        Paste the clipboard content generated by clicking **"📋 Report Issue / Copy Trace"** in `<myhome-bus-card>` here.
        Contains gateway parameters, buffer telemetry, and recent OpenWebNet frames.
      render: markdown
      placeholder: "Paste clipboard contents here (starts with ### MyHOME Diagnostic Bundle)..."
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Log Snippets / Python Tracebacks
      description: Relevant log entries or traceback snippets from Settings -> System -> Logs.
      render: text
      placeholder: "Paste relevant traceback or error messages from custom_components.myhome here..."
    validations:
      required: false

  - type: checkboxes
    id: diagnostics_checklist
    attributes:
      label: Diagnostics Checklist
      description: Attaching diagnostic bundles or logs significantly speeds up root-cause analysis and resolution.
      options:
        - label: "I have attached or pasted the MyHOME Bus Monitor diagnostic bundle or OpenWebNet frame trace."
        - label: "I have attached the Home Assistant full log file (.log or .zip) or pasted the crash traceback."
        - label: "I have attached the MyHOME integration diagnostics JSON (from Settings -> Devices & Services -> MyHOME)."
