name: "💡 New Device Request"
description: "Request support for a new or currently unsupported BTicino / Legrand device or configuration."
title: "[Device Request]: "
labels: ["enhancement", "device-support"]
body:
  - type: markdown
    attributes:
      value: |
        ## Request Support for BTicino / Legrand Hardware

        Thank you for requesting support for a BTicino / Legrand device or plant configuration!
        The **v2 Phase 1 rewrite** is built on **real OpenWebNet bus traces** from physical hardware so every supported device works reliably without guesswork.

        > 🔒 **Privacy note:** **Bus Monitor** exports (`💾 Export Trace` / `📋 Copy Trace`) omit passwords, LAN IPs/ports, serial paths, and full MAC addresses (keeping the 3-byte OUI prefix) while including environment/gateway metadata, telemetry, and raw frames. **Download diagnostics** JSON redacts config-entry secrets and network/hardware identifiers (`password`, `pin`, `token`, `secret`, `host`, full `mac`/`id`, `UDN`, `ssdp_location`, `friendly_name`, `file_path`, and peer MACs) and aliases audio zones/decoders, but retains metadata/telemetry and—for configured `expose` bindings—`entity_id` (which may contain personal or room names) and `current_ha_state`. **Ordinary debug logs do not carry the same redaction guarantees.** Please review all attachments and snippets before posting.

  - type: input
    id: device_model
    attributes:
      label: Device Model / Commercial Catalog Code
      description: The exact BTicino or Legrand catalog reference (e.g. F430/2, F411/4, LN4652, 3456, F420, HOMETOUCH 3488).
      placeholder: "e.g. F430/2"
    validations:
      required: true

  - type: input
    id: gateway_and_versions
    attributes:
      label: Gateway Model, Firmware & MyHOME Integration Version
      description: Which gateway model, firmware version (or "unknown / unavailable"), and MyHOME integration version (e.g. 2.0.0b16) are you running?
      placeholder: "e.g. MyHomeServer1 (FW 3.1.8, or 'unknown / unavailable'), MyHOME 2.0.0b16, HA 2026.10.1"
    validations:
      required: true

  - type: dropdown
    id: who_system
    attributes:
      label: OpenWebNet WHO System Domain
      description: Which OpenWebNet subsystem (WHO) does this device belong to?
      options:
        - "WHO=1 (Lighting / Relays / Actuators / Switches)"
        - "WHO=2 (Automation / Shutters / Blinds / Motorized actuators)"
        - "WHO=4 (Heating / Thermoregulation / Thermostats / Zones / Actuators)"
        - "WHO=14 (Special Commands / Locks)"
        - "WHO=15 (CEN Pushbuttons / Scenario Control)"
        - "WHO=16 / WHO=22 (Sound System / Audio Distribution)"
        - "WHO=18 (Energy Management / Power Meters / Actuators)"
        - "WHO=25 (CEN+ / Advanced Scenario Pushbuttons / Dry Contacts)"
        - "WHO=13 (Gateway & System Diagnostics)"
        - "Other / Unknown WHO"
    validations:
      required: true

  - type: textarea
    id: configuration
    attributes:
      label: Physical Configurators or Virtual Configuration (in English)
      description: Describe the configuration plugs inserted in the physical sockets (e.g. A=1, PL=2, ZA=0, ZB=7, M=MOD) or virtual parameters set via MyHOME_Suite / MyHOME_Up.
      placeholder: "e.g. F430/2 configured with ZA=0, ZB1=7, ZB2=8 without temperature probe, controlled via BTicino Home Touch"
    validations:
      required: true

  - type: textarea
    id: sample_bus_frames
    attributes:
      label: Sample OpenWebNet Bus Trace / Diagnostic Evidence
      description: |
        **Drag & drop** your **MyHOME Bus Monitor** export (`💾 Export Trace`), **Diagnostics JSON**, or debug log/screenshots, or paste the frames captured via **📋 Copy Trace** when operating the device from a physical switch, BTicino Home Touch, or MyHOME_Up app. If a bus trace cannot be collected, please explain why and provide relevant logs or protocol documentation.

        > 🔒 **Privacy note:** **Bus Monitor** exports omit passwords, LAN IPs/ports, serial paths, and full MAC addresses (keeping the 3-byte OUI prefix) while including environment/gateway metadata, telemetry, and raw frames. **Diagnostics JSON** redacts config-entry secrets and network/hardware identifiers (`password`, `pin`, `token`, `secret`, `host`, full `mac`/`id`, `UDN`, `ssdp_location`, `friendly_name`, `file_path`, and peer MACs) and aliases audio zones/decoders, but retains metadata/telemetry and—for configured `expose` bindings—`entity_id` (which may contain personal or room names) and `current_ha_state`. **Ordinary debug logs do not carry the same redaction guarantees.** Please review before posting.
      render: markdown
      placeholder: |
        Drag & drop myhome_trace_*.json here, paste captured frames, or explain why a bus trace is unavailable:
        ```
        *1*1*23##
        *#1*23*1*0##
        *1*0*23##
        ```
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Home Assistant Behavior
      description: What Home Assistant entity type and controls should this device map to (e.g. Light, Switch, Cover, Climate, Sensor, Event)?
      placeholder: "e.g. Should be controllable as an ON/OFF switch or climate zone..."
    validations:
      required: false

  - type: textarea
    id: documentation_links
    attributes:
      label: Documentation / Technical Datasheets
      description: Links to BTicino / Legrand product manuals, datasheets, or OpenWebNet protocol specifications.
      placeholder: "https://..."
    validations:
      required: false

  - type: checkboxes
    id: preflight_checklist
    attributes:
      label: "🛑 Before Submitting — Did You Check?"
      description: Please confirm the following before opening the request.
      options:
        - label: "I have written this request in English."
          required: true
        - label: "I have specified my Gateway model, Gateway firmware version (or 'unknown / unavailable'), and MyHOME integration version (e.g. 2.0.0b16)."
          required: true
        - label: "I have included an OpenWebNet bus trace, Diagnostics JSON, or relevant log/protocol documentation (or explained why a bus trace cannot be collected)."
          required: true
