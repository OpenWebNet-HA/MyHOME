blueprint:
  name: "MyHOME: Door & Gate Motion & Open-Alert Notifications"
  description: >-
    Sends real-time push notifications when a protected MyHOME garage door or gate
    starts opening, begins closing, or reaches confirmed closed state, plus an alert
    if the door is left open for too long.
  domain: automation
  source_url: https://github.com/OpenWebNet-HA/MyHOME/blob/v2-phase1-architecture/blueprints/automation/myhome/door_gate_motion_notification.yaml
  input:
    target_cover:
      name: "Gate or Garage Door"
      description: "Select the MyHOME cover entity to monitor."
      selector:
        entity:
          domain: cover
          integration: myhome
    notify_service:
      name: "Mobile App Notify Action"
      description: "Target mobile app notify action (e.g. notify.mobile_app_iphone)."
      selector:
        text:
    language:
      name: "Notification Language"
      description: "Language for push notifications and action buttons (English, Italiano, Nederlands, Deutsch, Français)."
      default: "en"
      selector:
        select:
          options:
            - label: "English"
              value: "en"
            - label: "Italiano"
              value: "it"
            - label: "Nederlands"
              value: "nl"
            - label: "Deutsch"
              value: "de"
            - label: "Français"
              value: "fr"
    notify_on_opening:
      name: "Notify When Opening Starts"
      default: true
      selector:
        boolean:
    notify_on_closed:
      name: "Notify When Fully Closed"
      default: true
      selector:
        boolean:
    notify_on_closing:
      name: "Notify When Closing Starts"
      default: false
      selector:
        boolean:
    left_open_minutes:
      name: "Alert If Left Open (Minutes)"
      description: "Send a reminder alert if the door remains open longer than this duration (0 = disabled)."
      default: 10
      selector:
        number:
          min: 0
          max: 120
          step: 1
          unit_of_measurement: "min"
          mode: slider

mode: restart
max_exceeded: silent

trigger:
  # 1. Door starts opening
  - platform: state
    entity_id: !input target_cover
    to: "opening"
    id: "opening"

  # 2. Door starts closing
  - platform: state
    entity_id: !input target_cover
    to: "closing"
    id: "closing"

  # 3. Door confirmed closed
  - platform: state
    entity_id: !input target_cover
    to: "closed"
    id: "closed"

  # 4. Door left open for prolonged duration
  - platform: state
    entity_id: !input target_cover
    to: "open"
    for:
      minutes: !input left_open_minutes
    id: "left_open"

variables:
  cover_entity: !input target_cover
  cover_name: "{{ state_attr(cover_entity, 'friendly_name') | default(cover_entity) }}"
  notify_opening_enabled: !input notify_on_opening
  notify_closing_enabled: !input notify_on_closing
  notify_closed_enabled: !input notify_on_closed
  open_minutes: !input left_open_minutes
  lang: !input language
  i18n:
    en:
      opening_title: "🚪 {{ cover_name }} is opening"
      opening_msg: "The door/gate is moving open."
      closing_title: "⚠️ {{ cover_name }} is closing"
      closing_msg: "The door/gate is moving closed."
      closed_title: "✅ {{ cover_name }} is closed"
      closed_msg: "The door/gate is now safely and fully closed."
      left_open_title: "⚠️ Alert: {{ cover_name }} is open!"
      left_open_msg: "The door/gate has been left open for more than {{ open_minutes }} minutes."
      close_action: "🔒 Close Now"
    it:
      opening_title: "🚪 {{ cover_name }} si sta aprendo"
      opening_msg: "La porta/cancello è in movimento verso l'apertura."
      closing_title: "⚠️ {{ cover_name }} si sta chiudendo"
      closing_msg: "La porta/cancello è in movimento verso la chiusura."
      closed_title: "✅ {{ cover_name }} è chiuso"
      closed_msg: "La porta/cancello è ora completamente e sicuramente chiusa."
      left_open_title: "⚠️ Attenzione: {{ cover_name }} è aperta!"
      left_open_msg: "La porta/cancello è rimasta aperta per più di {{ open_minutes }} minuti."
      close_action: "🔒 Chiudi ora"
    nl:
      opening_title: "🚪 {{ cover_name }} wordt geopend"
      opening_msg: "De deur/poort is in beweging richting open."
      closing_title: "⚠️ {{ cover_name }} begint te sluiten"
      closing_msg: "De deur/poort is in beweging richting dicht."
      closed_title: "✅ {{ cover_name }} is gesloten"
      closed_msg: "De deur/poort is nu veilig en volledig gesloten."
      left_open_title: "⚠️ Opgelet: {{ cover_name }} staat open!"
      left_open_msg: "De deur/poort staat al langer dan {{ open_minutes }} minuten open."
      close_action: "🔒 Sluit Nu"
    de:
      opening_title: "🚪 {{ cover_name }} wird geöffnet"
      opening_msg: "Das Tor/die Tür öffnet sich."
      closing_title: "⚠️ {{ cover_name }} schließt sich"
      closing_msg: "Das Tor/die Tür schließt sich."
      closed_title: "✅ {{ cover_name }} ist geschlossen"
      closed_msg: "Das Tor/die Tür ist jetzt sicher und vollständig geschlossen."
      left_open_title: "⚠️ Achtung: {{ cover_name }} ist offen!"
      left_open_msg: "Das Tor/die Tür steht seit mehr als {{ open_minutes }} Minuten offen."
      close_action: "🔒 Jetzt schließen"
    fr:
      opening_title: "🚪 {{ cover_name }} est en cours d'ouverture"
      opening_msg: "La porte/le portail est en mouvement vers l'ouverture."
      closing_title: "⚠️ {{ cover_name }} commence à se fermer"
      closing_msg: "La porte/le portail est en mouvement vers la fermeture."
      closed_title: "✅ {{ cover_name }} est fermé"
      closed_msg: "La porte/le portail est maintenant bien et totalement fermé."
      left_open_title: "⚠️ Attention: {{ cover_name }} est ouvert!"
      left_open_msg: "La porte/le portail est ouvert depuis plus de {{ open_minutes }} minutes."
      close_action: "🔒 Fermer maintenant"
  dict: "{{ i18n[lang] if lang in i18n else i18n['en'] }}"

action:
  - choose:
      # Opening
      - conditions:
          - condition: trigger
            id: "opening"
          - condition: template
            value_template: "{{ notify_opening_enabled }}"
        sequence:
          - action: !input notify_service
            data:
              title: "{{ dict.opening_title }}"
              message: "{{ dict.opening_msg }}"
              data:
                tag: "myhome_door_motion_{{ cover_entity }}"

      # Closing
      - conditions:
          - condition: trigger
            id: "closing"
          - condition: template
            value_template: "{{ notify_closing_enabled }}"
        sequence:
          - action: !input notify_service
            data:
              title: "{{ dict.closing_title }}"
              message: "{{ dict.closing_msg }}"
              data:
                tag: "myhome_door_motion_{{ cover_entity }}"

      # Closed
      - conditions:
          - condition: trigger
            id: "closed"
          - condition: template
            value_template: "{{ notify_closed_enabled }}"
        sequence:
          - action: !input notify_service
            data:
              title: "{{ dict.closed_title }}"
              message: "{{ dict.closed_msg }}"
              data:
                tag: "myhome_door_motion_{{ cover_entity }}"

      # Left Open Alert
      - conditions:
          - condition: trigger
            id: "left_open"
          - condition: template
            value_template: "{{ open_minutes > 0 }}"
        sequence:
          - action: !input notify_service
            data:
              title: "{{ dict.left_open_title }}"
              message: "{{ dict.left_open_msg }}"
              data:
                tag: "myhome_door_left_open_{{ cover_entity }}"
                actions:
                  - action: "MYHOME_CLOSE_LEFT_OPEN_{{ cover_entity }}"
                    title: "{{ dict.close_action }}"
                    destructive: true
