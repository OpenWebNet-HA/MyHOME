blueprint:
  name: "MyHOME: Secure Door & Gate Biometric Approval"
  description: >-
    Dispatches interactive mobile push notifications requiring biometric verification
    (FaceID/TouchID on iOS, Biometric/Screen Unlock on Android) whenever a protected
    MyHOME impulse gate or garage door operation is requested. Automatically handles
    the cryptographic single-use nonce for approval, and allows immediate cancellation.
  domain: automation
  source_url: https://github.com/OpenWebNet-HA/MyHOME/blob/master/blueprints/automation/myhome/secure_access_approval.yaml
  input:
    notify_service:
      name: "Mobile App Notify Action"
      description: "The notify action for your mobile device (e.g. notify.mobile_app_iphone or action notify.mobile_app_pixel)."
      selector:
        text:
    target_cover:
      name: "Protected Impulse Cover (Optional filter)"
      description: "Optionally restrict this approval handler to a specific gate or garage door entity."
      default: ""
      selector:
        entity:
          domain: cover
          integration: myhome
    language:
      name: "Notification Language"
      description: "Language for push notifications and action buttons (English, Italiano, Nederlands, Deutsch, Français)."
      default: "en"
      selector:
        select:
          options:
            - label: "English"
              value: "en"
            - label: "Italiano"
              value: "it"
            - label: "Nederlands"
              value: "nl"
            - label: "Deutsch"
              value: "de"
            - label: "Français"
              value: "fr"

mode: parallel
max: 10

trigger:
  - platform: event
    event_type: myhome_access_approval_requested

condition:
  - condition: template
    value_template: >-
      {{ not target_cover or trigger.event.data.entity_id == target_cover }}

variables:
  lang: !input language
  i18n:
    en:
      title_prefix: "⚠️ Security Request:"
      msg_ask: "Request to"
      msg_by: "by"
      msg_unknown: "unknown"
      msg_prompt: "Scan Face ID or fingerprint to confirm."
      approve_action: "✅ Approve (Biometric)"
      deny_action: "❌ Deny"
    it:
      title_prefix: "⚠️ Richiesta di sicurezza:"
      msg_ask: "Richiesta di"
      msg_by: "da parte di"
      msg_unknown: "sconosciuto"
      msg_prompt: "Scansiona Face ID o impronta per confermare."
      approve_action: "✅ Conferma (Biometrico)"
      deny_action: "❌ Rifiuta"
    nl:
      title_prefix: "⚠️ Beveiligingsverzoek:"
      msg_ask: "Verzoek tot"
      msg_by: "door"
      msg_unknown: "onbekend"
      msg_prompt: "Scan gezicht of vingerafdruk om te bevestigen."
      approve_action: "✅ Bevestig (Biometrisch)"
      deny_action: "❌ Weigeren"
    de:
      title_prefix: "⚠️ Sicherheitsanfrage:"
      msg_ask: "Anfrage zum"
      msg_by: "von"
      msg_unknown: "unbekannt"
      msg_prompt: "Bitte biometrisch (Face ID/Fingerabdruck) bestätigen."
      approve_action: "✅ Bestätigen (Biometrisch)"
      deny_action: "❌ Ablehnen"
    fr:
      title_prefix: "⚠️ Demande de sécurité:"
      msg_ask: "Demande pour"
      msg_by: "par"
      msg_unknown: "inconnu"
      msg_prompt: "Numérisez Face ID ou empreinte pour confirmer."
      approve_action: "✅ Confirmer (Biométrique)"
      deny_action: "❌ Refuser"
  dict: "{{ i18n[lang] if lang in i18n else i18n['en'] }}"
  resolved_title: "{{ dict.title_prefix }} {{ trigger.event.data.entity_id }}"
  resolved_message: >-
    {{ dict.msg_ask }} {{ trigger.event.data.intent }} {{ dict.msg_by }} {{ trigger.event.data.user_id | default(dict.msg_unknown) }}.
    {{ dict.msg_prompt }}

action:
  - action: !input notify_service
    data:
      title: "{{ resolved_title }}"
      message: "{{ resolved_message }}"
      data:
        push:
          category: "MYHOME_SECURE_ACCESS"
        actions:
          - action: "MYHOME_APPROVE_{{ trigger.event.data.nonce }}"
            title: "{{ dict.approve_action }}"
            authenticationRequired: true
            auth_required: true
            destructive: false
          - action: "MYHOME_DENY_{{ trigger.event.data.nonce }}"
            title: "{{ dict.deny_action }}"
            destructive: true

  - wait_for_trigger:
      - platform: event
        event_type: mobile_app_notification_action
        event_data:
          action: "MYHOME_APPROVE_{{ trigger.event.data.nonce }}"
      - platform: event
        event_type: mobile_app_notification_action
        event_data:
          action: "MYHOME_DENY_{{ trigger.event.data.nonce }}"
    timeout:
      seconds: "{{ trigger.event.data.timeout | default(45) }}"
    continue_on_timeout: false

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ wait.trigger.event.data.action == 'MYHOME_APPROVE_' ~ trigger.event.data.nonce }}"
        sequence:
          - action: >-
              {% if trigger.event.data.intent == 'open' %}
                cover.open_cover
              {% else %}
                cover.close_cover
              {% endif %}
            target:
              entity_id: "{{ trigger.event.data.entity_id }}"
            data:
              nonce: "{{ trigger.event.data.nonce }}"

      - conditions:
          - condition: template
            value_template: "{{ wait.trigger.event.data.action == 'MYHOME_DENY_' ~ trigger.event.data.nonce }}"
        sequence:
          - action: myhome.cancel_cover_request
            target:
              entity_id: "{{ trigger.event.data.entity_id }}"
