  mcp_notes: "Automation: UP event of point 14 (area 1, PL 4) from a local keypad; a press usually shows as *2*0*14## then *2*1*14## ~40 ms later (MH201 capture, MyHOME#433)"
  roundtrip: true

- id: cover.evt.stop.end_of_run.18
