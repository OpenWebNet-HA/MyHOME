# MH201 bus capture, MyHOME#433 (anonymized: frames only). A keypad general UP
# (*2*0*0## then *2*1*0## ~530 ms later, cover.cmd.stop/up.gen.0) produced no
# per-object UP frames; ~126 s later every actuator reported its own stop and
# none came for WHERE 0 - the published flow, WHO_2.pdf 3.0.1.2-3: for
# <where>=GEN,A,GR "as many frames as automation objects".
- id: cover.evt.stop.area.1
  frame: "*2*0*1##"
  direction: event
  who: 2
  what: 0
  where: "1"
  scope: area
  source: community-plant-capture
  mcp_valid: true
  mcp_notes: "Automation: STOP to area 1 (points 11-19, WHO_2.pdf Where Table A=[1-9] PL=[1-9]), the gateway's echo of an area command sent by Home Assistant; the covers were idle and no per-object frames followed (MH201 capture, MyHOME#433)"
  roundtrip: true
  builder:
    class: OWNAutomationCommand
    method: stop_shutter
    args: ["1"]

- id: cover.evt.up.ptp.14
  frame: "*2*1*14##"
