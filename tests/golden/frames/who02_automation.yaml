  roundtrip: true

# MH200 + F422 live test, 2026-09-23 (the maintainer's plant, tests/fixtures/plants/
# mh200_physical_plant: covers 11-16, 18, 19 behind interface 02, logical #4#
# addressing). Scope commands do not cross the F422: only point commands move
# those covers, while a scope status request is answered per object.
- id: cover.req.status.area.1.bus.02
  frame: "*#2*1#4#02##"
  direction: status_request
  who: 2
  what: null
  where: "1"
  interface: "02"
  scope: area
  source: community-plant-capture
  mcp_valid: true
  mcp_notes: "Automation: status of area 1 behind interface 02. MH200 answers with one *2*0*APL#4#02## per cover (11-16, 18, 19; 50 ms apart) and none for the area"
  roundtrip: true
  builder:
    class: OWNAutomationCommand
    method: status
    args: ["1#4#02"]

