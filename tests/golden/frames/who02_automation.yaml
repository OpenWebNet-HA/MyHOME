# Follow-up MyHomeServer1 + LN-4660M2 captures, 2026-09-28, contributed by @f18m
# (#445, comment 5868017035), answering the maintainer's outstanding questions
# about a STOP press on already-stationary shutters and local (non-centralized)
# keypad syntax.
- id: cover.status.dimension10.rest100.04
  frame: "*#2*04*10*10*100*001*0##"
  direction: dimension_response
  who: 2
  what: null
  where: "04"
  dimension: 10
  dimension_values: ["10", "100", "001", "0"]
  scope: point
  source: community-plant-capture
  mcp_valid: true
  mcp_notes: "Automation: Dimension 10 status-code 10 (stopped) at position 100% for an actuator that was never in motion during this capture, from the same stationary STOP-press trace as cover.cmd.general.stop.advanced.stationary; openwebnet-mcp's grammar-only reading ('10% open') is wrong here as elsewhere in this corpus, see README Provenance"
  roundtrip: true

- id: cover.evt.down.ptp.lnkeypad.02
  frame: "*2*2*02##"
  direction: event
  who: 2
  what: 2
  where: "02"
  scope: point
  source: community-plant-capture
  mcp_valid: true
  mcp_notes: "Automation: the LN-4660M2's own LOCAL room button (not the centralized/general one) emits the plain *2*WHAT*WHERE## syntax at the individual point address, not the multi-parameter Advanced form used on General address 0; confirms local keypads and the centralized button differ in frame shape even on the same hardware family (#445 comment 5868017035)"
  roundtrip: true

- id: cover.status.dimension10.transitional.closing.02
  frame: "*#2*02*10*12*100*001*0##"
  direction: dimension_response
  who: 2
  what: null
  where: "02"
  dimension: 10
  dimension_values: ["12", "100", "001", "0"]
  scope: point
  source: community-plant-capture
  mcp_valid: true
  mcp_notes: "Automation: Dimension 10 report with status-code 12 (closing, from initial position 100%) captured mid-movement immediately after the local DOWN event (cover.evt.down.ptp.lnkeypad.02); first real-world confirmation of OWNd's state==12 'closing from initial position' branch (message.py OWNAutomationEvent), previously reachable only via spec inference; openwebnet-mcp reads dimension_values[0] as a raw percentage ('12% open'), which is the grammar-only misreading the README Provenance section warns about"
  roundtrip: true

