  mcp_valid: true
  mcp_notes: "Multimedia (WHO 7): Free audio/video resources (WHAT 9; OWNAVCommand.close_video), printed as *7*9**## in the WHO 7 PDF (§3.2). No capture; not in openwebnet4j or in the pinned firmware oracle"
