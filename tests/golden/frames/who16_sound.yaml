- id: sound.dim.volume.response.21
  frame: "*#16*21*1*15##"
  direction: dimension_response
  who: 16
  where: "21"
  dimension: 1
  dimension_values: ["15"]
  source: community-plant-capture
  mcp_valid: true
  mcp_notes: "Plant A: amplifier 21 reports volume 15 of 31 on MH200."
  roundtrip: true

- id: sound.dim.volume.request.22
  frame: "*#16*22*1##"
  direction: dimension_request
  who: 16
  what: null
  where: "22"
  dimension: 1
  source: community-plant-capture
  mcp_valid: true
  mcp_notes: "Plant A: request volume level for amplifier 22 on MH200."
  roundtrip: true

- id: sound.dim.volume.response.22
  frame: "*#16*22*1*15##"
  direction: dimension_response
  who: 16
  where: "22"
  dimension: 1
  dimension_values: ["15"]
  source: community-plant-capture
  mcp_valid: true
