# ── RDS (DIMENSION 8) ─────────────────────────────────────────────────────────

- id: sound.dim.rds.response.101
  frame: "*#16*101*8*32*82*97*100*105*111*32*49##"
  direction: dimension_response
  who: 16
  where: "101"
  dimension: 8
  dimension_values: ["32", "82", "97", "100", "105", "111", "32", "49"]
  source: community-plant-capture
  mcp_valid: true
  mcp_notes: "Plant B captured a live RDS broadcast on source 1 as eight ASCII codes. The station name has been replaced with ' Radio 1' here — the payload is what the contributor happened to be listening to, and only the shape (DIMENSION 8, eight codes) is under test."
  roundtrip: true
