  frame: "*#16*21*1##"
  direction: dimension_request
  who: 16
  what: null
  where: "21"
  dimension: 1
  source: community-plant-capture
  mcp_valid: true
  mcp_notes: "Plant A: request volume level for amplifier 21 on MH200."
