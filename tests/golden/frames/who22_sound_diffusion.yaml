# WHO=22 Sound Diffusion — dual-dialect MH200N mirror captures & OWNSoundDiffusion vectors.
#
# Contributed with Plant B captures (MyHOME#422) and MH202 intercom audio-ducking
# captures (MyHOME#669), paired with Encyclopedia WHO=22 builder conformance vectors.
# Parsed by OWNd via OWNSoundDiffusionEvent and OWNSoundDiffusionCommand.

- id: sounddiff.event.routing.env1.source1
  frame: "*22*2#4#1*5#2#1##"
  direction: event
  who: 22
  what: "2#4#1"
  where: "5"
  where_param: ["2", "1"]
  source: community-plant-capture
  mcp_valid: true
  mcp_notes: "Grammar accepted by openwebnet-mcp (STATUS_EVENT). The meaning follows the Encyclopedia's WHO=22 page: WHAT 2 'source turned on' with multimedia type 4 (stereo) and area 1, WHERE 5#2#1 naming source 1. Mirrors *16*3*111##."
  roundtrip: true

- id: sounddiff.event.routing.env1.source2
  frame: "*22*2#4#1*5#2#2##"
  direction: event
  who: 22
  what: "2#4#1"
  where: "5"
  where_param: ["2", "2"]
  source: community-plant-capture
  mcp_valid: true
  mcp_notes: "Same area, source 2. Against sounddiff.event.routing.env1.source1 only the source field moves, which is what pins the last digit of the WHO=16 form. Mirrors *16*3*112##."
  roundtrip: true

- id: sounddiff.event.routing.env2.source1
  frame: "*22*2#4#2*5#2#1##"
  direction: event
  who: 22
  what: "2#4#2"
  where: "5"
  where_param: ["2", "1"]
  source: community-plant-capture
  mcp_valid: true
  mcp_notes: "Area 2, source 1: here the area field moves instead. Mirrors *16*3*121##."
  roundtrip: true

- id: sounddiff.event.routing.env8.source1
  frame: "*22*2#4#8*5#2#1##"
  direction: event
  who: 22
  what: "2#4#8"
  where: "5"
  where_param: ["2", "1"]
  source: community-plant-capture
  mcp_valid: true
  mcp_notes: "Last frame of a general power-on that sweeps areas 1..8 onto source 1. Mirrors *16*3*181##."
  roundtrip: true

- id: sounddiff.dim.state.area1.point1
  frame: "*#22*3#1#1*12*1*4##"
  direction: dimension_response
  who: 22
  where: "3"
  where_param: ["1", "1"]
  dimension: 12
  dimension_values: ["1", "4"]
  source: community-plant-capture
  mcp_valid: true
  mcp_notes: "Speaker area 1, point 1: device state ON, multimedia type 4 (stereo). Mirrors *16*3*11## — the WHO=16 address 11 written out as area 1, point 1."
  roundtrip: true

- id: sounddiff.dim.state.area1.point2
  frame: "*#22*3#1#2*12*1*4##"
  direction: dimension_response
  who: 22
  where: "3"
  where_param: ["1", "2"]
  dimension: 12
  dimension_values: ["1", "4"]
  source: community-plant-capture
  mcp_valid: true
  mcp_notes: "Area 1, point 2. Mirrors *16*3*12##: same area as 11, different amplifier."
  roundtrip: true

- id: sounddiff.dim.state.area3.point1
  frame: "*#22*3#3#1*12*1*4##"
  direction: dimension_response
  who: 22
  where: "3"
  where_param: ["3", "1"]
  dimension: 12
  dimension_values: ["1", "4"]
  source: community-plant-capture
  mcp_valid: true
  mcp_notes: "Area 3, point 1. Mirrors *16*3*31##."
  roundtrip: true

- id: sounddiff.dim.volume.area1.point1
  frame: "*#22*3#1#1*1*17##"
  direction: dimension_response
  who: 22
  where: "3"
  where_param: ["1", "1"]
  dimension: 1
  dimension_values: ["17"]
  source: community-plant-capture
  mcp_valid: true
  mcp_notes: "Volume 17 on area 1 point 1, emitted together with *#16*11*1*17##. DIMENSION 1 carries the same 0..31 scale in both dialects."
  roundtrip: true

- id: sounddiff.dim.state.source1.on
  frame: "*#22*2#1*12*1*4##"
  direction: dimension_response
  who: 22
  where: "2"
  where_param: ["1"]
  dimension: 12
  dimension_values: ["1", "4"]
  source: community-plant-capture
  mcp_valid: true
  mcp_notes: "Source 1 active, stereo. Mirrors *16*3*101##."
  roundtrip: true

- id: sounddiff.dim.rds.source1
  frame: "*#22*5#2#1*10*32*82*97*100*105*111*32*49##"
  direction: dimension_response
  who: 22
  where: "5"
  where_param: ["2", "1"]
  dimension: 10
  dimension_values: ["32", "82", "97", "100", "105", "111", "32", "49"]
  source: community-plant-capture
  mcp_valid: true
  mcp_notes: "RDS text for source 1 under DIMENSION 10, where WHO=16 reports the same payload under DIMENSION 8. Station name replaced with ' Radio 1' for the same reason as sound.dim.rds.response.101."
  roundtrip: true

- id: sounddiff.dim.volume.duck.area4.point1
  frame: "*#22*3#4#1*1*1##"
  direction: dimension_response
  who: 22
  where: "3"
  where_param: ["4", "1"]
  dimension: 1
  dimension_values: ["1"]
  source: community-plant-capture
  mcp_valid: true
  mcp_notes: "Plant MH202 (issue #669): video intercom stream start ducks volume to 1 on area 4 point 1 (zone 41). Mirrors *#16*41*1*1##."
  roundtrip: true

- id: sounddiff.dim.volume.restore.area4.point1
  frame: "*#22*3#4#1*1*6##"
  direction: dimension_response
  who: 22
  where: "3"
  where_param: ["4", "1"]
  dimension: 1
  dimension_values: ["6"]
  source: community-plant-capture
  mcp_valid: true
  mcp_notes: "Plant MH202 (issue #669): video intercom stream stop restores volume 6 on area 4 point 1 (zone 41). Mirrors *#16*41*1*6##."
  roundtrip: true

- id: sounddiff.req.frequency.source1
  frame: "*#22*2#1*5##"
  direction: dimension_request
  who: 22
  what: null
  where: "2"
  where_param: ["1"]
  dimension: 5
  source: community-plant-capture
  mcp_valid: true
  mcp_notes: "Sound Diffusion: Request tuner frequency (Dimension 5) on source 1 (WHERE 2#1; received twice on an H/L4684 (FW 6.0.11) bus, MyHOME trace issue_466, HL4684 all, 2026-11-01T11-48-15; an F461 (FW 2.0.11) answered the same request with NACK, MyHOME trace f461_live_2026-10-23)"
  roundtrip: true
  builder:
    class: OWNSoundDiffusionCommand
    method: request_frequency
    args: ["2#1"]

- id: sounddiff.req.preset.source1
  frame: "*#22*2#1*6##"
  direction: dimension_request
  who: 22
  what: null
  where: "2"
  where_param: ["1"]
  dimension: 6
  source: community-plant-capture
  mcp_valid: true
  mcp_notes: "Sound Diffusion: Request active station preset (Dimension 6) on source 1 (WHERE 2#1; probe only: sent to an F461 (FW 2.0.11) and answered NACK, never received in a stored trace; MyHOME trace f461_live_2026-10-23; the oracle_who22_tuner trace that sends it is a synthetic firmware-oracle trace)"
  roundtrip: true
  builder:
    class: OWNSoundDiffusionCommand
    method: request_preset
    args: ["2#1"]

- id: sounddiff.cmd.turn_on_with_source.area1.point1.output_area1
  frame: "*22*1#4#1*3#1#1##"
  direction: command
  who: 22
  what: "1#4#1"
  where: "3"
  where_param: ["1", "1"]
  source: encyclopedia
  mcp_valid: true
  mcp_notes: "Sound Diffusion: Atomic speaker turn-on with stereo multimedia type (4) and output area 1 on speaker 3#1#1 (WHO 22 PDF version 1.1: <area> in section 1.1, frames in 3.1.2 and 3.2.2; Encyclopedia functional/who-22-sound-diffusion). Not a source: in trace who22_myhomeserver1_f500_h4562 the same 1#4#1 is followed by *#22*3#7#5*12*1*1## (audio channel 1) for one zone and by *#22*3#7#6*12*1*2## (audio channel 2) for the other."
  roundtrip: true
  builder:
    class: OWNSoundDiffusionCommand
    method: turn_on_with_source
    args: ["3#1#1", 1, 4]

- id: sounddiff.dim.write.volume.area1.point1.17
  frame: "*#22*3#1#1*#1*17##"
  direction: dimension_write
  who: 22
  what: null
  where: "3"
  where_param: ["1", "1"]
  dimension: 1
  dimension_values: ["17"]
  source: encyclopedia
  mcp_valid: true
  mcp_notes: "Sound Diffusion: Set speaker 3#1#1 volume to 17 on Dimension #1 (Encyclopedia functional/who-22-sound-diffusion)"
  roundtrip: true
  builder:
    class: OWNSoundDiffusionCommand
    method: set_volume
    args: ["3#1#1", 17]

- id: sounddiff.req.device_state.area1.point1
  frame: "*#22*3#1#1*12##"
  direction: dimension_request
  who: 22
  what: null
  where: "3"
  where_param: ["1", "1"]
  dimension: 12
  source: encyclopedia
  mcp_valid: true
  mcp_notes: "Sound Diffusion: Request device state (Dimension 12) on speaker 3#1#1 (Encyclopedia functional/who-22-sound-diffusion)"
  roundtrip: true
  builder:
    class: OWNSoundDiffusionCommand
    method: request_device_state
    args: ["3#1#1"]
