  mcp_valid: true
  mcp_notes: "Zone 2 cooling setpoint 35.0 °C, the plant's cooling protection value, sent ~230 ms before the real setpoint (*#4*2*7*2*1*0260##) when the zone leaves OFF (MyHomeServer1 capture 18:11:34, MyHOME#429)"
  roundtrip: true

- id: thermo.capture.dim7.cooling_protection.z2
