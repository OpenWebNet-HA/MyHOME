  mcp_notes: "Last set up weekly program activation command (WHO_4 2.pdf 1.6.8 p. 33; Encyclopedia who-4-temperature-control/what.md 'Restore last weekly program' 3100). Sent through an F461 2.0.11 to a 3550 that was OFF (*4*203*#0##): ACK after 97 ms, and within 0.15 s the 3550 put *4*2101*#0##, *4*21*#0##, *4*31*#0##, *4*22*#0## on the bus (seen on the F461 and on an F455 1.0.76 event monitor), then the zones' program setpoints (*#4*2*#14*0200*2##, *#4*3*#14*0200*2##); *#4*#0## 3 s later answered *4*2101*#0##, *4*21*#0##, *4*31*#0##. Repeated once (ACK 111 ms, same answer). Test plant, 2026-11-12 16:08:55 and 16:09:35 UTC. Built by set_central_mode('#0', 'auto')"
  roundtrip: true
  builder:
    class: OWNHeatingCommand
    method: set_central_mode
    args: ["#0", "auto"]

