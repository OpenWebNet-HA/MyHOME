# ── DIMENSION 7 zone state and DIMENSION 5, MyHomeServer1 + Home+Control (MyHOME#429, OWNd#58) ──
# Dimension 7 is not in WHO_4 2.pdf; openwebnet-mcp accepts the grammar and
# warns that it is undocumented. Meaning per the MyHOME_Suite ScenarioDevices
# templates (Encyclopedia who-4-temperature-control/dimensions.md):
# *#4*ZONE*7*CONTEXT*STATE[*TTTT]##, context 1 heating / 2 cooling,
# state 1 setpoint / 2 protection.

- id: thermo.capture.dim7.cooling_setpoint.z2
  frame: "*#4*2*7*2*1*0260##"
  direction: dimension_response
  who: 4
  what: null
  where: "2"
  dimension: 7
  dimension_values: ["2", "1", "0260"]
  source: community-plant-capture
  mcp_valid: true
  mcp_notes: "Zone 2 cooling setpoint 26.0 °C: the Home+Control app switched the zone from OFF to manual at 26 °C (MyHomeServer1 capture 18:11:35, MyHOME#429 comment 5800423418)"
  roundtrip: true

- id: thermo.capture.dim7.cooling_setpoint_35.z2
  frame: "*#4*2*7*2*1*0350##"
