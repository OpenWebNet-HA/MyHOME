        author: "issue #433 reporter (anonymized: frames and their spacing only)"
        date: "2026-09-23"
        gateway: "BTicino MH201"
        devices: "Eight shutters 11-18 (area 1): keypad point runs, a general UP (*2*0*0## + *2*1*0##) ended by one stop per actuator ~126 s later and none for WHERE 0, an area-1 stop echo (*2*0*1##)"
      - name: "Live Bus Test (BTicino MH200 + F422, Automation WHO 2 scope commands)"
        reference: "https://github.com/OpenWebNet-HA/MyHOME/issues/433"
        author: "Laurens (@GreenGrassBlueOcean)"
        date: "2026-09-23"
        gateway: "BTicino MH200"
        devices: "Covers 11-16, 18, 19 behind F422 interface 02 (logical #4# addressing): area status request answered per object; area commands on the main bus (*2*2*1##) and on the private bus (*2*1*1#4#02##) moved none of them; point commands did"
      - name: "Physical Bus Capture (MyHomeServer1 + Home+Control, WHO 4 heating and cooling)"
        reference: "https://github.com/OpenWebNet-HA/MyHOME/issues/429"
        author: "@TheDarkWizard"
        date: "2026-09-23"
        gateway: "BTicino MyHomeServer1, firmware 2.87.13"
        devices: "Four zones, one KM4691 thermostat each driving an F430R8; zone 4 is heating-only. Card exports of OFF / manual / cooling transitions: dimension 7 carries the zone state and setpoint, never the reply to *#4*Z##"
      - name: "Passive Bus Trace (F454 on a MyHomeServer1 + Home+Control plant, WHO 4 schedule)"
        reference: "https://github.com/OpenWebNet-HA/MyHOME/issues/429#issuecomment-5813061888"
        author: "@xtimmy86x"
        date: "2026-09-24"
        gateway: "BTicino F454, firmware 2.0 (Home Assistant's gateway); MyHomeServer1 runs the program on the same bus"
        devices: "Seven heating zones: 13 h trace in which MyHomeServer1 writes *#4*Z*#7*1*1*TTTT## at each program step (06:00, 09:00), each zone answers with the dimension 7 status, and *#4*Z*#5*0## is re-asserted every ~794 s"
      - name: "Physical Bus Capture (BTicino MH200N Sweep & Climate Interaction)"
        reference: "https://github.com/OpenWebNet-HA/MyHOME/issues/466#issuecomment-5834435606"
        author: "@caiosweet"
        date: "2026-09-25"
        gateway: "BTicino MH200N, firmware 1.1.8"
        devices: "Bus sweep (lights, covers, climate, gateway, energy) plus manual setpoint change (18 °C) and probe knob local offset cycle (-3 to +3 °C)"
